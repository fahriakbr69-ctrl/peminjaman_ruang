<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Peminjaman Ruang Kampus</title>
</head>
<body>
  <h1>Sistem Peminjaman Ruang Kampus</h1>

  <form id="formPinjam">
    <p>
      <label>Nama Mahasiswa:</label><br>
      <input type="text" id="nama" placeholder="Masukkan nama" required>
    </p>

    <p>
      <label>Pilih Ruang:</label><br>
      <select id="ruang">
        <option>Ruang 101</option>
        <option>Ruang 202</option>
        <option>Laboratorium 1</option>
      </select>
    </p>

    <p>
      <label>Tanggal:</label><br>
      <input type="date" id="tanggal" required>
    </p>

    <button type="submit">Ajukan Peminjaman</button>
  </form>

  <p id="hasil"></p>

  <script>
    document.getElementById("formPinjam").addEventListener("submit", function(e) {
      e.preventDefault();
      let nama = document.getElementById("nama").value;
      let ruang = document.getElementById("ruang").value;
      let tanggal = document.getElementById("tanggal").value;

      document.getElementById("hasil").innerText =
        "Pengajuan " + nama + " untuk " + ruang + " pada " + tanggal + " berhasil dicatat.";
    });
  </script>
</body>
</html>
